services:
  postgres:
    image: postgres:16-alpine
    container_name: catai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catai
      POSTGRES_PASSWORD: catai
      POSTGRES_DB: catai
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catai -d catai']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
