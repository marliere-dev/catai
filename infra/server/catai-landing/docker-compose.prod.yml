name: catai-landing

services:
  collector:
    image: catai-landing-collector:${COLLECTOR_TAG:-v0.1.0}
    container_name: catai-collector
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      RATE_LIMIT_PER_IP_PER_HOUR: ${RATE_LIMIT_PER_IP_PER_HOUR:-10}
      JSONL_PATH: /data/contacts.jsonl
    volumes:
      - ./data:/data
    networks:
      - catai-net
      - npm
    cpus: 0.25
    mem_limit: 128m

  web:
    image: nginx:1.27-alpine
    container_name: catai-web
    restart: unless-stopped
    depends_on:
      - collector
    environment:
      SITE_TAG: ${SITE_TAG}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./releases:/var/www/releases:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - catai-net
      - npm
    cpus: 0.25
    mem_limit: 128m

networks:
  catai-net:
    driver: bridge
  npm:
    external: true
    name: nginx-proxy-manager_default
